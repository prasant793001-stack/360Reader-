# Builds 360Reader in the cloud.
#
#  • Every push to main: builds the Android APK and Windows installer and keeps
#    them as downloadable "artifacts" on the Actions run (a quick check that
#    everything still compiles).
#  • Every pushed version tag (git tag v1.0.0) or published GitHub Release (e.g. tag v1.0.0): builds both and attaches
#    360Reader-<version>.apk and 360Reader-<version>.msi to that release, ready
#    to download and install from your phone or PC.
name: Build 360Reader

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}"
          VERSION="${TAG#v}"
          [ -n "$VERSION" ] || VERSION="0.0.${{ github.run_number }}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Load signing key (if set up)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using your release signing key."
          else
            echo "No signing key secret yet: building with a temporary debug key."
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then .github/report-errors.sh build.log; fi
          exit "$status"

      - name: Publish build log (on failure)
        if: failure()
        shell: bash
        run: |
          git config user.name "360Reader CI"
          git config user.email "ci@users.noreply.github.com"
          cp build.log "$RUNNER_TEMP/build.log" || echo "no log" > "$RUNNER_TEMP/build.log"
          git checkout --orphan "ci-log-${{ github.job }}"
          git rm -rf --cached . > /dev/null
          cp "$RUNNER_TEMP/build.log" build.log
          git add -f build.log
          git commit -m "Build log for run ${{ github.run_id }}"
          git push -f origin "HEAD:ci-log-${{ github.job }}"

      - name: Name the APK
        shell: bash
        run: |
          mkdir -p out
          cp composeApp/build/outputs/apk/release/*.apk "out/360Reader-$APP_VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}"
          VERSION="${TAG#v}"
          [ -n "$VERSION" ] || VERSION="1.0.${{ github.run_number }}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build MSI
        shell: bash
        run: |
          ./gradlew.bat :composeApp:packageReleaseMsi --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then bash .github/report-errors.sh build.log; fi
          exit "$status"

      - name: Publish build log (on failure)
        if: failure()
        shell: bash
        run: |
          git config user.name "360Reader CI"
          git config user.email "ci@users.noreply.github.com"
          cp build.log "$RUNNER_TEMP/build.log" || echo "no log" > "$RUNNER_TEMP/build.log"
          git checkout --orphan "ci-log-${{ github.job }}"
          git rm -rf --cached . > /dev/null
          cp "$RUNNER_TEMP/build.log" build.log
          git add -f build.log
          git commit -m "Build log for run ${{ github.run_id }}"
          git push -f origin "HEAD:ci-log-${{ github.job }}"

      - name: Name the installer
        shell: bash
        run: |
          mkdir -p out
          cp composeApp/build/compose/binaries/main-release/msi/*.msi "out/360Reader-$APP_VERSION.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.msi

  release:
    name: Attach to release
    if: github.event_name == 'release' || github.ref_type == 'tag'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: 360Reader ${{ github.event.release.tag_name || github.ref_name }}
          body: |
            **Android:** download the `.apk` on your phone, open it and tap **Install**.
            **Windows 11:** download the `.msi` and run it. Install the free LibreOffice too, so Word, Excel and PowerPoint files open.
          files: out/*
