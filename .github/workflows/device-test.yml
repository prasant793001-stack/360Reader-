# Installs the app on an Android emulator, opens real Office files and records
# what happens (screenshots + log), so problems can be seen without a phone.
name: Device test (Android)

on:
  push:
    branches: [main]
    paths: ['composeApp/**', 'libreoffice-kit/**', '.github/workflows/device-test.yml', '.github/test/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: device-test
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Add the office engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download office-engine -p 'lo-engine-arm64.tar.gz' -D "$RUNNER_TEMP" -R "$GITHUB_REPOSITORY"
          KIT=libreoffice-kit/src/main
          mkdir -p "$RUNNER_TEMP/engine" && tar -xzf "$RUNNER_TEMP/lo-engine-arm64.tar.gz" -C "$RUNNER_TEMP/engine"
          mkdir -p "$KIT/jniLibs" "$KIT/assets"
          cp -r "$RUNNER_TEMP/engine/jniLibs/arm64-v8a" "$KIT/jniLibs/"
          cp -r "$RUNNER_TEMP/engine/assets/." "$KIT/assets/"
          cp "$RUNNER_TEMP/engine/java/org/libreoffice/kit/"*.java "$KIT/java/org/libreoffice/kit/"

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --console=plain

      - name: Make sample files
        run: |
          pip install --quiet python-pptx openpyxl
          python3 .github/test/make_samples.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/test/run_on_device.sh

      - name: Publish results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/results" && cp -r results/. "$RUNNER_TEMP/results/" 2>/dev/null || echo "no results" > "$RUNNER_TEMP/results/none.txt"
          git config user.name "360Reader CI"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log-device
          git rm -rf --cached . > /dev/null
          rm -rf results && cp -r "$RUNNER_TEMP/results" results
          git add -f results
          git commit -qm "Device test results, run ${{ github.run_id }}"
          git push -qf origin HEAD:ci-log-device
